# VK Cloud не пропускает на машину входящие ICMP, в том числе «пакет слишком
# большой». Без них сервер не узнаёт, что на пути к клиенту узкое место, и
# соединение виснет на первой крупной порции (сертификаты при рукопожатии):
# у клиента «ошибка TLS» или «превышен лимит времени» (INCY, 23.09.2026).
# Ядро само уменьшает пакеты соединения, если большие пропадают.
net.ipv4.tcp_mtu_probing = 1
net.ipv4.tcp_base_mss = 1024
