# Вход подписок в российском облаке (VK Cloud): unlockru.site → шлюз на бот-сервере.
# Точная копия прокси с литовской ноды 2.59.162.34, которая остаётся запасной.
# Сертификат пока скопирован с литовской ноды в /etc/ssl/unlockru.site; после
# переключения DNS сюда certbot выпустит свой через webroot.
server {
    listen 80;
    listen [::]:80;
    server_name unlockru.site;

    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }
    location / {
        return 301 https://unlockru.site$request_uri;
    }
}

server {
    listen 127.0.0.1:8443 ssl http2 proxy_protocol;
    server_name unlockru.site;
    ssl_certificate /etc/letsencrypt/live/unlockru.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/unlockru.site/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    gzip on;
    gzip_proxied any;
    gzip_min_length 256;
    gzip_comp_level 6;
    gzip_types application/json text/plain text/html;

    location ~ ^/(sub|happ)/ {
        proxy_pass https://23.95.3.18;
        proxy_ssl_server_name on;
        proxy_ssl_name 23.95.3.18.sslip.io;
        proxy_set_header Host 23.95.3.18.sslip.io;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Accept-Encoding "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 15s;
    }
    location / { return 404; }
}

# Всё, что пришло не на наши имена (сканеры по IP), — молча закрываем.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 444;
}
