# Вход сайта в российском облаке (VK Cloud): unlockproject.site → сайт на 168.113.210.6.
# Само приложение остаётся на российском сервере сайта; здесь только входная точка.
# Настоящий IP посетителя уходит в X-Relay-Client-IP вместе с общим секретом
# (/etc/nginx/relay-secret.conf ↔ RELAY_SECRET в /etc/unlock-web.env): без него все
# посетители попали бы в одну корзину лимитов сайта.
server {
    listen 80;
    listen [::]:80;
    server_name unlockproject.site www.unlockproject.site;

    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }
    location / {
        return 301 https://unlockproject.site$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.unlockproject.site;
    ssl_certificate /etc/ssl/unlockproject/fullchain.pem;
    ssl_certificate_key /etc/ssl/unlockproject/privkey.pem;
    return 301 https://unlockproject.site$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name unlockproject.site;
    ssl_certificate /etc/ssl/unlockproject/fullchain.pem;
    ssl_certificate_key /etc/ssl/unlockproject/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 5m;

    location / {
        proxy_pass https://168.113.210.6;
        proxy_ssl_server_name on;
        proxy_ssl_name unlockproject.site;
        proxy_set_header Host unlockproject.site;
        proxy_set_header X-Relay-Client-IP $remote_addr;
        include /etc/nginx/relay-secret.conf;
        proxy_set_header X-Forwarded-Proto https;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }
}
