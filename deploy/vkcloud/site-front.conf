# Вход сайта в российском облаке (VK Cloud): unlockproject.site → сайт на 168.113.210.6.
# Само приложение остаётся на российском сервере сайта; здесь только входная точка.
# Настоящий IP посетителя уходит в X-Relay-Client-IP вместе с общим секретом
# (/etc/nginx/relay-secret.conf ↔ RELAY_SECRET в /etc/unlock-web.env): без него все
# посетители попали бы в одну корзину лимитов сайта.
server {
    listen 80;
    listen [::]:80;
    server_name unlockproject.site www.unlockproject.site;

    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }
    location / {
        return 301 https://unlockproject.site$request_uri;
    }
}

server {
    listen 127.0.0.1:8443 ssl http2 proxy_protocol;
    server_name www.unlockproject.site;
    ssl_certificate /etc/letsencrypt/live/unlockproject.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/unlockproject.site/privkey.pem;
    return 301 https://unlockproject.site$request_uri;
}

server {
    listen 127.0.0.1:8443 ssl http2 proxy_protocol;
    server_name unlockproject.site;
    ssl_certificate /etc/letsencrypt/live/unlockproject.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/unlockproject.site/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 5m;

    # Отдача подписки через сайт (/sub/, /happ/) — прямо в шлюз, мимо Next.js:
    # через приложение сайта ответ на 83 КБ обрывался на 15 КБ (23.09.2026).
    # Ссылки подписок по-прежнему выдаются на unlockru.site.
    gzip on;
    gzip_proxied any;
    gzip_min_length 256;
    gzip_comp_level 6;
    gzip_types application/json text/plain text/html;
    location ~ ^/(sub|happ)/ {
        proxy_pass https://23.95.3.18;
        proxy_ssl_server_name on;
        proxy_ssl_name 23.95.3.18.sslip.io;
        proxy_set_header Host 23.95.3.18.sslip.io;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Accept-Encoding "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 15s;
    }

    location / {
        proxy_pass https://168.113.210.6;
        proxy_ssl_server_name on;
        proxy_ssl_name unlockproject.site;
        proxy_set_header Host unlockproject.site;
        proxy_set_header X-Relay-Client-IP $remote_addr;
        include /etc/nginx/relay-secret.conf;
        proxy_set_header X-Forwarded-Proto https;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }
}
