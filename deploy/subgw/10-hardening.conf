# Усиление шлюза подписок (аудит 22.09.2026, OPS-03). Шлюз смотрит в интернет
# через Caddy — раньше он работал от root.
#
# Установка:
#   useradd --system --no-create-home --shell /usr/sbin/nologin unlock-subgw
#   chown -R unlock-subgw:unlock-subgw /var/lib/unlock-subgw
#   install -D -m 644 10-hardening.conf /etc/systemd/system/unlock-subgw.service.d/10-hardening.conf
#   systemctl daemon-reload && systemctl restart unlock-subgw
# Откат: удалить каталог unlock-subgw.service.d, chown root обратно, daemon-reload, restart.
#
# Пишет шлюз только базу устройств в /var/lib/unlock-subgw; здоровье нод
# (/run/unlock-node-health.json) он только читает. Обычный расход ~17 МБ.
[Service]
User=unlock-subgw
Group=unlock-subgw
ReadWritePaths=/var/lib/unlock-subgw
Environment=PYTHONDONTWRITEBYTECODE=1
UMask=0077
NoNewPrivileges=yes
PrivateTmp=yes
PrivateDevices=yes
ProtectSystem=strict
ProtectHome=tmpfs
ProtectKernelTunables=yes
ProtectKernelModules=yes
ProtectKernelLogs=yes
ProtectControlGroups=yes
ProtectClock=yes
ProtectHostname=yes
RestrictSUIDSGID=yes
RestrictRealtime=yes
RestrictNamespaces=yes
RestrictAddressFamilies=AF_INET AF_INET6 AF_UNIX
LockPersonality=yes
SystemCallArchitectures=native
MemoryHigh=200M
MemoryMax=300M
