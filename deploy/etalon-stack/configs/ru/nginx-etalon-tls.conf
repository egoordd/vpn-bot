# Etalon: HTTPS-сайты за входом Reality. Xray на :443 отдаёт всё, что не VPN-клиент, сюда (127.0.0.1:9443).
map $http_upgrade $connection_upgrade { default upgrade; "" close; }

server {
    listen 127.0.0.1:9443 ssl http2 default_server;
    server_name 89.221.203.114.sslip.io;
    ssl_certificate /etc/letsencrypt/live/89.221.203.114.sslip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/89.221.203.114.sslip.io/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    gzip on;
    gzip_types application/json text/plain text/html;
    location /mapp/etalon/ {
        proxy_pass http://127.0.0.1:18095;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_read_timeout 30s;
    }
    location /sub/ {
        proxy_pass http://127.0.0.1:12096;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_read_timeout 30s;
    }
    location / {
        default_type text/plain;
        return 200 "ok\n";
    }
}

server {
    listen 127.0.0.1:9443 ssl http2;
    server_name panel.89.221.203.114.sslip.io;
    ssl_certificate /etc/letsencrypt/live/panel.89.221.203.114.sslip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/panel.89.221.203.114.sslip.io/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    gzip on;
    gzip_proxied any;
    gzip_types application/javascript text/css application/json image/svg+xml text/plain;
    client_max_body_size 10m;
    location / {
        proxy_pass http://127.0.0.1:18000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 120s;
    }
}
