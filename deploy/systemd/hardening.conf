# Усиление unlock-api, unlock-vpnbot, unlock-support и unlock-mirror (аудит 22.09.2026, OPS-03).
#
# До этого все они работали от root без ограничений: уязвимость в любом из них
# давала root на машине, где живут панель, база и шлюз подписок.
#
# Установка на сервере (для каждого сервиса; у зеркала лимиты памяти уже в самом юните):
#   useradd --system --no-create-home --shell /usr/sbin/nologin unlockapp
#   chgrp unlockapp /opt/vpn-bot/.env && chmod 640 /opt/vpn-bot/.env
#   install -D -m 644 hardening.conf /etc/systemd/system/<сервис>.service.d/10-hardening.conf
#   install -D -m 644 memory/<сервис>.conf /etc/systemd/system/<сервис>.service.d/20-memory.conf
#   systemctl daemon-reload && systemctl restart <сервис>
# Откат: удалить каталог <сервис>.service.d, daemon-reload, restart.
#
# Сервисы ничего не пишут на диск: журналы открывает сам systemd
# (StandardOutput=append:), база и Redis — по TCP. Поэтому вся система
# только для чтения, а байткод не пишется.
[Service]
# Кто бы ни переписал .env (руками, выкладкой), группа и права возвращаются при
# каждом старте: «+» — от root и вне песочницы. Иначе сервисы не прочтут настройки.
ExecStartPre=+/bin/sh -c 'chgrp unlockapp /opt/vpn-bot/.env && chmod 640 /opt/vpn-bot/.env'
User=unlockapp
Group=unlockapp
Environment=PYTHONDONTWRITEBYTECODE=1
UMask=0077
NoNewPrivileges=yes
PrivateTmp=yes
PrivateDevices=yes
ProtectSystem=strict
ProtectHome=tmpfs
ProtectKernelTunables=yes
ProtectKernelModules=yes
ProtectKernelLogs=yes
ProtectControlGroups=yes
ProtectClock=yes
ProtectHostname=yes
RestrictSUIDSGID=yes
RestrictRealtime=yes
RestrictNamespaces=yes
RestrictAddressFamilies=AF_INET AF_INET6 AF_UNIX
LockPersonality=yes
SystemCallArchitectures=native
