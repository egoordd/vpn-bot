# Сайт Plata VPN (заказчик Ярослав): главная, тарифы, оформление подписки и документы для ЮKassa.
# С 15.10.2026 — Next.js статикой (sites/plata-web, next build → out/) в /var/www/plata; до этого —
# визитка scripts/make_plata_site.py. Адреса документов прежние: /tariffs/ /terms/ /privacy/ /support/.
server {
    listen 80;
    listen [::]:80;
    server_name plata.168.113.210.6.sslip.io;
    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }
    location / {
        return 301 https://plata.168.113.210.6.sslip.io$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name plata.168.113.210.6.sslip.io;
    ssl_certificate /etc/letsencrypt/live/plata.168.113.210.6.sslip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/plata.168.113.210.6.sslip.io/privkey.pem;

    root /var/www/plata;
    index index.html;
    error_page 404 /404.html;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml text/plain application/json;

    # Next.js кладёт в страницы встроенные скрипты и стили — без 'unsafe-inline' формы и анимации не оживут.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; object-src 'none'; form-action 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;

    location /_next/static/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
    }
    location / {
        try_files $uri $uri/ $uri.html =404;
        add_header Cache-Control "no-cache";
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; object-src 'none'; form-action 'self'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "DENY" always;
    }
}
