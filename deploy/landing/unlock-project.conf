# Визитка UnLock VPN (unlock-project.site). Статика, без приложения за спиной.
#
# Живёт на российском сервере сайта 168.113.210.6 рядом с unlockproject.site:
#   /etc/nginx/sites-available/unlock-project  (+ ссылка в sites-enabled)
#   /var/www/unlock-project.site               (файлы — scripts/deploy_landing.sh)
#
# Сертификат Let's Encrypt выпущен через webroot, продлевается certbot.timer
# и перезагружает nginx сам:
#   certbot certonly --webroot -w /var/www/letsencrypt \
#     -d unlock-project.site -d www.unlock-project.site \
#     --non-interactive --deploy-hook "systemctl reload nginx"
#
# После правки: nginx -t && systemctl reload nginx

server {
    listen 80;
    listen [::]:80;
    server_name unlock-project.site www.unlock-project.site;

    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }
    location / {
        return 301 https://unlock-project.site$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.unlock-project.site;
    ssl_certificate /etc/letsencrypt/live/unlock-project.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/unlock-project.site/privkey.pem;
    return 301 https://unlock-project.site$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name unlock-project.site;
    ssl_certificate /etc/letsencrypt/live/unlock-project.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/unlock-project.site/privkey.pem;

    root /var/www/unlock-project.site;
    index index.html;

    location /fonts/ {
        add_header Cache-Control "public, max-age=2592000, immutable";
    }
    location = /og.png {
        add_header Cache-Control "public, max-age=604800";
    }
    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache";
    }
}
