# Сайт Etalon VPN (заказчик Марат) на своём домене getetalon.site (куплен 14.10.2026 на reg.ru).
# Статика Next.js (sites/etalon-web, next build → out/) в /var/www/etalon.
# Сервер 168.113.210.6: /etc/nginx/sites-available/etalon. Серт LE getetalon.site + www (webroot, хук reload-nginx).
# Прежний адрес etalon.168.113.210.6.sslip.io (на нём Platega видела сайт) — постоянный переход на домен.

server {
    listen 80;
    listen [::]:80;
    server_name getetalon.site www.getetalon.site etalon.168.113.210.6.sslip.io;
    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }
    location / {
        return 301 https://getetalon.site$request_uri;
    }
}

# www и прежний адрес — на основной домен.
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.getetalon.site;
    ssl_certificate /etc/letsencrypt/live/getetalon.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/getetalon.site/privkey.pem;
    return 301 https://getetalon.site$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name etalon.168.113.210.6.sslip.io;
    ssl_certificate /etc/letsencrypt/live/etalon.168.113.210.6.sslip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/etalon.168.113.210.6.sslip.io/privkey.pem;
    return 301 https://getetalon.site$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name getetalon.site;
    ssl_certificate /etc/letsencrypt/live/getetalon.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/getetalon.site/privkey.pem;

    root /var/www/etalon;
    index index.html;
    error_page 404 /404.html;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml text/plain application/json;

    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; object-src 'none'; form-action 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    location /_next/static/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
    }
    location / {
        try_files $uri $uri/ $uri.html =404;
        add_header Cache-Control "no-cache";
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; object-src 'none'; form-action 'self'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "DENY" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
    }
}
