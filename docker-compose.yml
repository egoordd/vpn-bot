services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-vpn_bot}
      POSTGRES_USER: ${POSTGRES_USER:-vpn_bot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vpn_bot_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-vpn_bot} -d ${POSTGRES_DB:-vpn_bot}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  bot:
    build: .
    restart: unless-stopped
    environment:
      BOT_TOKEN: ${BOT_TOKEN:?BOT_TOKEN is required}
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      REDIS_URL: ${REDIS_URL:?REDIS_URL is required}
      CRYPTOBOT_TOKEN: ${CRYPTOBOT_TOKEN:-}
      CRYPTOBOT_API_URL: ${CRYPTOBOT_API_URL:-https://pay.crypt.bot/api}
      CRYPTOBOT_POLL_INTERVAL: ${CRYPTOBOT_POLL_INTERVAL:-30}
      PANEL_PROVIDER: ${PANEL_PROVIDER:-remnawave}
      MARZBAN_API_URL: ${MARZBAN_API_URL:-}
      MARZBAN_ACCESS_TOKEN: ${MARZBAN_ACCESS_TOKEN:-}
      MARZBAN_USERNAME: ${MARZBAN_USERNAME:-}
      MARZBAN_PASSWORD: ${MARZBAN_PASSWORD:-}
      MARZBAN_USERNAME_PREFIX: ${MARZBAN_USERNAME_PREFIX:-tg}
      MARZBAN_DEFAULT_PROXIES: ${MARZBAN_DEFAULT_PROXIES:-}
      MARZBAN_DEFAULT_INBOUNDS: ${MARZBAN_DEFAULT_INBOUNDS:-}
      MARZBAN_DATA_LIMIT_RESET_STRATEGY: ${MARZBAN_DATA_LIMIT_RESET_STRATEGY:-no_reset}
      REMNAWAVE_API_URL: ${REMNAWAVE_API_URL:-}
      REMNAWAVE_API_TOKEN: ${REMNAWAVE_API_TOKEN:-}
      REMNAWAVE_USERNAME_PREFIX: ${REMNAWAVE_USERNAME_PREFIX:-tg}
      REMNAWAVE_DEFAULT_TRAFFIC_RESET_STRATEGY: ${REMNAWAVE_DEFAULT_TRAFFIC_RESET_STRATEGY:-NO_RESET}
      REMNAWAVE_NODE_CONFIG_PROFILE_UUID: ${REMNAWAVE_NODE_CONFIG_PROFILE_UUID:-}
      REMNAWAVE_NODE_INBOUND_UUIDS: ${REMNAWAVE_NODE_INBOUND_UUIDS:-}
      REMNAWAVE_NODE_PORT: ${REMNAWAVE_NODE_PORT:-2222}
      REMNAWAVE_HOST_PORT: ${REMNAWAVE_HOST_PORT:-0}
      REMNAWAVE_HOST_TAG: ${REMNAWAVE_HOST_TAG:-AUTO}
      REMNAWAVE_NODE_COUNTRY_CODE: ${REMNAWAVE_NODE_COUNTRY_CODE:-XX}
      REMNAWAVE_NODE_TRAFFIC_TRACKING: ${REMNAWAVE_NODE_TRAFFIC_TRACKING:-false}
      VULTR_API_URL: ${VULTR_API_URL:-https://api.vultr.com/v2}
      VULTR_API_TOKEN: ${VULTR_API_TOKEN:-}
      VULTR_DEFAULT_REGION: ${VULTR_DEFAULT_REGION:-ams}
      VULTR_DEFAULT_PLAN: ${VULTR_DEFAULT_PLAN:-vc2-1c-1gb}
      VULTR_DEFAULT_OS_ID: ${VULTR_DEFAULT_OS_ID:-0}
      VULTR_SSH_KEY_IDS: ${VULTR_SSH_KEY_IDS:-}
      VULTR_NODE_CAPACITY: ${VULTR_NODE_CAPACITY:-50}
      VULTR_NODE_LABEL_PREFIX: ${VULTR_NODE_LABEL_PREFIX:-unlock}
      AUTOSCALE_CHECK_INTERVAL_SECONDS: ${AUTOSCALE_CHECK_INTERVAL_SECONDS:-300}
      AUTOSCALE_PREMIUM_REGIONS: ${AUTOSCALE_PREMIUM_REGIONS:-}
      AUTOSCALE_PREMIUM_MIN_FREE_SLOTS: ${AUTOSCALE_PREMIUM_MIN_FREE_SLOTS:-1}
      AUTOSCALE_PREMIUM_MIN_ACTIVE_NODES: ${AUTOSCALE_PREMIUM_MIN_ACTIVE_NODES:-0}
      AUTOSCALE_MAX_PROVISIONS_PER_REGION: ${AUTOSCALE_MAX_PROVISIONS_PER_REGION:-1}
      AUTOSCALE_DECOMMISSION_EMPTY: ${AUTOSCALE_DECOMMISSION_EMPTY:-true}
      WG_CONFIG_PATH: ${WG_CONFIG_PATH:-/etc/wireguard/clients}
      WG_INTERFACE: ${WG_INTERFACE:-awg0}
      WG_SERVER_PUBLIC_KEY: ${WG_SERVER_PUBLIC_KEY:-}
      WG_SERVER_ENDPOINT: ${WG_SERVER_ENDPOINT:-}
      WG_CLIENT_DNS: ${WG_CLIENT_DNS:-1.1.1.1}
      WG_ALLOWED_IPS: ${WG_ALLOWED_IPS:-0.0.0.0/0}
      WG_CLIENT_ADDRESS_POOL: ${WG_CLIENT_ADDRESS_POOL:-10.9.0.0/24}
      AWG_JC: ${AWG_JC:-4}
      AWG_JMIN: ${AWG_JMIN:-40}
      AWG_JMAX: ${AWG_JMAX:-70}
      AWG_S1: ${AWG_S1:-50}
      AWG_S2: ${AWG_S2:-100}
      AWG_H1: ${AWG_H1:-1234567}
      AWG_H2: ${AWG_H2:-2345678}
      AWG_H3: ${AWG_H3:-3456789}
      AWG_H4: ${AWG_H4:-4567890}
      SUPPORT_USERNAME: ${SUPPORT_USERNAME:-support}
      ADMIN_IDS: ${ADMIN_IDS:-}
      DB_ECHO: ${DB_ECHO:-false}
    command: ["sh", "-c", "alembic upgrade head && python main.py"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
